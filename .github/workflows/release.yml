name: Релиз

# Тег v<версия> → установщик собирается здесь и попадает в черновик релиза на GitHub.
# Опубликовать черновик — вручную, на странице Releases.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Тег совпадает с версией в package.json
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") {
            Write-Error "Тег ${{ github.ref_name }} не совпадает с версией $version в package.json"
            exit 1
          }

      - run: npm ci
      - run: npm run typecheck

      # Помощник для звука и яркости собираем из исходников, а не берём готовый exe из репозитория
      - name: Сборка PlayOSHelper.exe
        run: npm run build:helper

      # Electron и инструменты electron-builder (NSIS, rcedit) — из кэша прошлых сборок: не качать их каждый раз
      - uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-

      - name: Сборка и загрузка в черновик
        shell: pwsh
        # Загрузки с релизов GitHub (Electron, его контрольные суммы, NSIS) временами отвечают 504. Удачно скачанное
        # остаётся в кэше, поэтому каждая следующая попытка продвигается дальше; черновик каждый раз собирается заново
        run: |
          for ($i = 1; $i -le 6; $i++) {
            npm run release
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "Попытка $i не удалась, повтор через 20 с"
            Start-Sleep -Seconds 20
          }
          exit 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 7-Zip для упаковки установщика — свой, из репозитория: одной загрузкой с GitHub меньше
          ELECTRON_BUILDER_7ZIP_PATH: ${{ github.workspace }}\resources\7zip\7z.exe
          # Ключи OAuth-приложений облаков: electron-vite встраивает MAIN_VITE_* в main-процесс.
          # Без них в сборке остаётся только «Папка синхронизации»
          MAIN_VITE_YANDEX_CLIENT_ID: ${{ secrets.MAIN_VITE_YANDEX_CLIENT_ID }}
          MAIN_VITE_YANDEX_CLIENT_SECRET: ${{ secrets.MAIN_VITE_YANDEX_CLIENT_SECRET }}
          MAIN_VITE_GOOGLE_CLIENT_ID: ${{ secrets.MAIN_VITE_GOOGLE_CLIENT_ID }}
          MAIN_VITE_GOOGLE_CLIENT_SECRET: ${{ secrets.MAIN_VITE_GOOGLE_CLIENT_SECRET }}
